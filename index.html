
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ℂ𝕙𝕒𝕟𝕦_𝕏 𝕄𝕠𝕧𝕚𝕖𝕏</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0e;color:white;
font-family:Arial,sans-serif}
header{padding:25px 18px;background:#15151b;
border-bottom:2px solid #e50914}
.logo{font-size:24px;font-weight:900;color:#ff2638}
header p{color:#aaa;font-size:13px}
.search{width:100%;padding:13px;border-radius:8px;
border:1px solid #444;background:#202027;color:white}
main{padding:18px;max-width:1000px;margin:auto}
h2{font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.movie{background:#19191f;border-radius:10px;
overflow:hidden;padding-bottom:14px}
.poster{width:100%;height:125px;object-fit:cover;
background:#292932}
.movie h3{font-size:15px;margin:12px 10px 6px}
.movie p{font-size:12px;color:#aaa;margin:0 10px 12px}
.btn{display:block;text-align:center;margin:0 10px;
background:#e50914;color:white;padding:10px;
border-radius:6px;text-decoration:none;font-size:13px}
.note{color:#aaa;font-size:13px;line-height:1.6}
footer{text-align:center;padding:25px;color:#777;
font-size:12px}
@media(min-width:650px){
.grid{grid-template-columns:repeat(3,1fr)}
.poster{height:200px}
}
</style>
</head>
<body>
<header>
  <div class="logo">ℂ𝕙𝕒𝕟𝕦_𝕏 𝕄𝕠𝕧𝕚𝕖𝕏</div>
  <p>TRAILERS • CINEMA • ENTERTAINMENT</p>
</header>
<main>
  <input id="search" class="search"
  placeholder="Search movies..."
  aria-label="Search movies">
  <h2>🎬 Featured Videos</h2>
  <div class="grid" id="movies"></div>
  <h2>About Us</h2>
  <p class="note">
    Welcome to Chanu_X MovieX! Discover movie trailers
    and videos shared from authorized sources.
    Select Watch Video to visit the official video page.
  </p>
</main>
<footer>© 2026 Chanu_X MovieX • Watch responsibly</footer>
<script>
const videos = [
  {
    title:"Featured Trailer 01",
    category:"Official trailer",
    image:"https://placehold.co/600x350/20202a/ffffff?text=Movie+Trailer",
    url:"https://www.youtube.com/"
  },
  {
    title:"Featured Video 02",
    category:"Cinema & entertainment",
    image:"https://placehold.co/600x350/30202a/ffffff?text=Featured+Video",
    url:"https://www.youtube.com/"
  },
  {
    title:"Featured Trailer 03",
    category:"New trailers",
    image:"https://placehold.co/600x350/202a30/ffffff?text=Coming+Soon",
    url:"https://www.youtube.com/"
  }
];
const container = document.getElementById("movies");
function render(query=""){
  container.innerHTML="";
  videos.filter(v=>v.title.toLowerCase().includes(query.toLowerCase()))
  .forEach(v=>{
    const card=document.createElement("article");
    card.className="movie";
    const img=document.createElement("img");
    img.className="poster";
    img.src=v.image;
    img.alt=v.title;
    const title=document.createElement("h3");
    title.textContent=v.title;
    const desc=document.createElement("p");
    desc.textContent=v.category;
    const link=document.createElement("a");
    link.className="btn";
    link.href=v.url;
    link.target="_blank";
    link.rel="noopener noreferrer";
    link.textContent="Watch Video ↗";
    card.append(img,title,desc,link);
    container.appendChild(card);
  });
}
document.getElementById("search").addEventListener("input",e=>{
  render(e.target.value);
});
render();
</script>
</body>
</html>
